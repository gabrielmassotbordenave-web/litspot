<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LitSpot — Find Sunny Spots & Sun-Lit Terraces Near You</title>
  
  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- MapLibre GL JS (Pour la carte de base 2D) -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <!-- Deck.gl (Pour la 3D, le Shadow Mapping et les performances GPU) -->
  <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>
  
  <!-- SunCalc (Le Moteur Astronomique SPA) -->
  <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; background: #e2e8f0; }
    #map-container { position: absolute; inset: 0; }
    
    /* --- UI DU SLIDER TEMPÔREL --- */
    .time-pill { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100; background: rgba(28,20,16,0.92); border: 1px solid rgba(255,240,220,0.14); border-radius: 22px; padding: 15px 30px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); width: 80%; max-width: 400px; transition: opacity 0.3s ease; }
    .pill-time-group { display: flex; flex-direction: column; align-items: center; min-width: 60px;}
    .pill-time { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: #FFF5E6; line-height: 1; white-space: nowrap; }
    .pill-status { font-size: 20px; line-height: 1; }
    
    /* Slider Range natif (plus stable sur mobile) */
    .time-slider { flex-grow: 1; -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: rgba(255,240,220,0.14); border-radius: 3px; outline: none; }
    .time-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; background: radial-gradient(circle at 38% 38%, #FFE07A, #E8890C); border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 3px rgba(232,137,12,0.25), 0 0 12px rgba(232,137,12,0.5); }
    .time-slider::-moz-range-thumb { width: 24px; height: 24px; background: radial-gradient(circle at 38% 38%, #FFE07A, #E8890C); border-radius: 50%; cursor: pointer; border: none; box-shadow: 0 0 0 3px rgba(232,137,12,0.25), 0 0 12px rgba(232,137,12,0.5); }
  </style>
</head>
<body>

  <!-- Conteneur pour Deck.gl et MapLibre -->
  <div id="map-container"></div>

  <!-- Interface Utilisateur : Le Slider Temporel -->
  <div class="time-pill">
    <div class="pill-time-group">
      <div class="pill-status" id="statusEmoji">☀️</div>
      <div class="pill-time" id="timeTxt">12:00</div>
    </div>
    <input type="range" min="0" max="1439" value="720" class="time-slider" id="timeSlider">
  </div>

<script>
  // --- CONFIGURATION INITIALE ---
  // Nous utilisons la clé Mapbox uniquement pour charger le style de base (Positron) si nécessaire, 
  // mais MapLibre est utilisé comme moteur de rendu 2D pour éviter les coûts de facturation Mapbox JS.
  const INITIAL_VIEW_STATE = {
    longitude: -73.5878, // Montréal
    latitude: 45.5088,
    zoom: 15.5,
    pitch: 55,
    bearing: -20
  };

  // --- ÉTAT GLOBAL ---
  let currentMinutes = 12 * 60; // Commence à midi
  let deckgl; // Référence à l'instance Deck.gl

  // --- LE MOTEUR D'OMBRE (LightingEffect & Shadow Mapping) ---
  // C'est le cœur de la nouvelle architecture : le GPU gère la lumière.
  function getLightingEffect(minutes) {
    const date = new Date();
    date.setHours(Math.floor(minutes / 60), Math.floor(minutes % 60), 0, 0);

    // Calcul Astronomique précis (SunCalc)
    const sunPosition = SunCalc.getPosition(date, INITIAL_VIEW_STATE.latitude, INITIAL_VIEW_STATE.longitude);
    const sunAzimuth = (sunPosition.azimuth * 180) / Math.PI;
    const sunAltitude = (sunPosition.altitude * 180) / Math.PI;

    // Lumière ambiante douce pour ne pas avoir des ombres 100% noires
    const ambientLight = new deck.AmbientLight({
      color: [255, 255, 255],
      intensity: 0.4
    });

    // La source de lumière directionnelle qui calcule la "Depth Map" pour les ombres
    const directionalLight = new deck.SunLight({
      timestamp: date.getTime(),
      color: [255, 248, 240], // Couleur chaude du soleil
      intensity: sunAltitude > 0 ? 1.2 : 0.0, // S'éteint la nuit
      _shadow: true // ACTIVATION DU SHADOW MAPPING GPU
    });

    return new deck.LightingEffect({ ambientLight, directionalLight });
  }

  // --- LES COUCHES 3D (Bâtiments) ---
  function renderLayers() {
    // Utilisation de Tile3DLayer pour charger les données géométriques
    // Option A (Parfaite pour GitHub) : Google Photorealistic 3D Tiles via l'API Deck.gl
    // Option B (À terme, si tu as un serveur) : URL vers ton fichier CityGML converti en .b3dm
    
    // Note: Pour cet exemple statique, nous générons des polygones extrudés simulés via GeoJsonLayer 
    // car les sources OGC 3D Tiles gratuites sans clé API sont rares en "Vanilla JS".
    // Dans une version finale avec un serveur, tu remplacerais ceci par Tile3DLayer.

    // Pour te prouver que le Shadow Mapping fonctionne parfaitement avec Deck.gl, 
    // voici une simulation de bâtiments autour de Montréal.
    const buildingLayer = new deck.GeoJsonLayer({
      id: 'simulated-buildings',
      data: generateSimulatedBuildings(INITIAL_VIEW_STATE.latitude, INITIAL_VIEW_STATE.longitude),
      extruded: true,
      wireframe: false,
      opacity: 1,
      getElevation: d => d.properties.height,
      getFillColor: [230, 230, 235], // Couleur de la façade
      shadowEnabled: true, // EXTRÊMEMENT IMPORTANT : Le bâtiment "cast" (projette) et reçoit des ombres
      pickable: true
    });

    // Le sol de base pour "recevoir" les ombres
    const groundLayer = new deck.PolygonLayer({
      id: 'ground-receiver',
      data: [{
        polygon: [
          [-73.65, 45.45], [-73.65, 45.55], [-73.50, 45.55], [-73.50, 45.45]
        ]
      }],
      extruded: false,
      filled: true,
      getFillColor: [242, 244, 248], // Couleur du sol
      shadowEnabled: true // Le sol doit recevoir l'ombre
    });

    return [groundLayer, buildingLayer];
  }

  // --- INITIALISATION DU MOTEUR DECK.GL ---
  function initDeckGL() {
    deckgl = new deck.DeckGL({
      container: 'map-container',
      mapStyle: 'https://basemaps.cartocdn.com/gl/positron-nolabels-gl-style/style.json', // Fond 2D MapLibre très léger
      initialViewState: INITIAL_VIEW_STATE,
      controller: true,
      
      // OPTIMISATION VRAM CRITIQUE : Assure 60 FPS lors du glissement du slider
      useDevicePixels: false, 
      
      effects: [getLightingEffect(currentMinutes)],
      layers: renderLayers(),
      
      // Callbacks pour interagir avec la vue
      onViewStateChange: ({viewState}) => {
        // Optionnel : on pourrait mettre à jour la vue de la carte 2D ici si on gérait MapLibre séparément
      }
    });
  }

  // --- MISE À JOUR DE LA LUMIÈRE (Le Throttling est géré nativement par WebGL) ---
  function updateLighting(minutes) {
    if (!deckgl) return;
    
    // Mettre à jour l'interface
    const h = String(Math.floor(minutes / 60)).padStart(2, '0');
    const m = String(minutes % 60).padStart(2, '0');
    document.getElementById('timeTxt').textContent = `${h}:${m}`;
    
    const d = new Date(); d.setHours(Math.floor(minutes / 60), Math.floor(minutes % 60), 0, 0);
    const alt = (SunCalc.getPosition(d, INITIAL_VIEW_STATE.latitude, INITIAL_VIEW_STATE.longitude).altitude * 180) / Math.PI;
    document.getElementById('statusEmoji').textContent = alt < -6 ? '🌙' : alt <= 0 ? '🌅' : alt < 10 ? '🌤️' : '☀️';

    // Remplacer l'effet d'éclairage dans Deck.gl
    // WebGL est assez puissant pour faire ça en temps réel (60fps)
    deckgl.setProps({
      effects: [getLightingEffect(minutes)]
    });
  }

  // --- EVENT LISTENERS ---
  const timeSlider = document.getElementById('timeSlider');
  timeSlider.addEventListener('input', (e) => {
    currentMinutes = parseInt(e.target.value);
    updateLighting(currentMinutes);
  });

  // Démarrage de l'application
  initDeckGL();


  // --- FONCTION UTILITAIRE (Pour la démonstration sans serveur) ---
  // Génère quelques tours de bureaux autour du point central pour montrer les ombres de Deck.gl
  function generateSimulatedBuildings(lat, lng) {
    const features = [];
    const size = 0.0003; // Taille des blocs
    for (let i = 0; i < 30; i++) {
      const offsetX = (Math.random() - 0.5) * 0.01;
      const offsetY = (Math.random() - 0.5) * 0.01;
      const height = 20 + Math.random() * 80; // Hauteur entre 20m et 100m
      
      features.push({
        type: 'Feature',
        properties: { height: height },
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [lng + offsetX - size, lat + offsetY - size],
            [lng + offsetX + size, lat + offsetY - size],
            [lng + offsetX + size, lat + offsetY + size],
            [lng + offsetX - size, lat + offsetY + size],
            [lng + offsetX - size, lat + offsetY - size]
          ]]
        }
      });
    }
    return { type: 'FeatureCollection', features: features };
  }
</script>
</body>
</html>
