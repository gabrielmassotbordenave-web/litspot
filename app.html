<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LitSpot — Find Sunny Spots & Sun-Lit Terraces Near You</title>

<!-- SEO -->
<meta name="description" content="LitSpot shows you exactly where the sun shines right now — and all day. See real building shadows on a live map. Find the sunniest terrace, park or street near you.">
<meta name="keywords" content="sunny spot, find sun, sunny terrace, shadow map, where is the sun, sun position map, sunniest place, terrace in the sun, building shadows">
<meta name="author" content="LitSpot">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://litspot.app/">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://litspot.app/">
<meta property="og:title" content="LitSpot — Find Sunny Terraces Near You">
<meta property="og:description" content="Real-time shadow map with 3D buildings. See where the sun shines, block by block, any time of day.">
<meta property="og:image" content="https://litspot.app/og-image.jpg">
<meta property="og:locale" content="en_US">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="LitSpot — Find Sunny Terraces Near You">
<meta name="twitter:description" content="Real-time shadow map with 3D buildings. See where the sun shines, block by block.">
<meta name="twitter:image" content="https://litspot.app/og-image.jpg">

<!-- Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "LitSpot",
  "url": "https://litspot.app",
  "description": "Real-time sun and shadow map for finding sunny terraces and outdoor spots, using 3D building data and precise solar position calculations.",
  "applicationCategory": "TravelApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "featureList": [
    "Real-time building shadow simulation",
    "Precise solar position calculation",
    "3D building map",
    "Time-of-day slider",
    "Location search"
  ]
}
</script>

<!-- FIX 1: Added Cormorant Garamond to font load (was missing, causing fallback serif) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src='https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js'></script>
<link href='https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css' rel='stylesheet'>
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; height: 100dvh;
  overflow: hidden;
  font-family: 'Outfit', sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#map { position: absolute; inset: 0; }

/* Mapbox controls */
.mapboxgl-ctrl-group {
  background: rgba(255,255,255,0.92) !important;
  border: 1px solid rgba(0,0,0,0.08) !important;
}
.mapboxgl-ctrl-attrib { font-size: 9px !important; }
.mapboxgl-ctrl-bottom-right {
  bottom: calc(env(safe-area-inset-bottom) + 16px) !important;
  right: 12px !important;
}

/* ── TOP BAR ── */
.top-bar {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: 12px; right: 12px;
  z-index: 100;
  display: flex;
  gap: 8px;
  align-items: center;
}
.search-wrap { position: relative; flex: 1; }
#searchInput {
  width: 100%;
  background: rgba(255,255,255,0.92);
  border: none;
  border-radius: 14px;
  padding: 13px 40px 13px 38px;
  font-family: 'Outfit', sans-serif;
  font-size: 16px; /* 16px min prevents iOS Safari auto-zoom on focus */
  font-weight: 400;
  color: #1a1a2e;
  outline: none;
  box-shadow: 0 2px 16px rgba(0,0,0,0.10), inset 0 0 0 0.5px rgba(0,0,0,0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  -webkit-appearance: none;
  transition: box-shadow 0.2s;
}
#searchInput::placeholder { color: rgba(0,0,0,0.28); font-weight: 300; }
#searchInput:focus {
  box-shadow: 0 2px 16px rgba(0,0,0,0.10), inset 0 0 0 1.5px #E8890C;
}
.s-icon {
  position: absolute; left: 13px; top: 50%;
  transform: translateY(-50%); font-size: 15px;
  pointer-events: none; opacity: .30;
}
#spinner {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  border: 1.5px solid rgba(0,0,0,0.08);
  border-top-color: #E8890C;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
@keyframes pinDrop { from { transform: translateY(-20px); opacity:0; } to { transform: translateY(0); opacity:1; } }

/* FIX 2: Added pinGlow keyframes — was referenced in makePin() but never defined */
@keyframes pinGlow {
  0%, 100% { box-shadow: 0 2px 12px rgba(0,0,0,0.3), 0 0 0 4px rgba(255,184,0,0.3); }
  50%       { box-shadow: 0 2px 12px rgba(0,0,0,0.3), 0 0 0 12px rgba(255,184,0,0); }
}

#ac-list {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: rgba(255,255,255,0.99);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 12px 36px rgba(0,0,0,0.14);
  z-index: 500;
  display: none;
}
.ac-item {
  padding: 14px 16px;
  cursor: pointer;
  border-bottom: 1px solid rgba(0,0,0,0.04);
  -webkit-tap-highlight-color: rgba(232,137,12,0.1);
}
.ac-item:last-child { border-bottom: none; }
.ac-item:active { background: rgba(232,137,12,0.08); }
.ac-name { font-size: 15px; font-weight: 500; color: #1a1a2e; }
.ac-addr { font-size: 12px; color: rgba(0,0,0,0.35); margin-top: 3px; }

.geo-btn {
  width: 44px; height: 44px;
  border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,0.92);
  border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer;
  box-shadow: 0 2px 16px rgba(0,0,0,0.10), inset 0 0 0 0.5px rgba(0,0,0,0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s, box-shadow 0.15s;
}
.geo-btn:active {
  transform: scale(0.93);
  box-shadow: 0 1px 8px rgba(0,0,0,0.10), inset 0 0 0 0.5px rgba(0,0,0,0.06);
}

/* ── TIME PILL ── */
.time-pill {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  background: rgba(28,20,16,0.92);
  border: 1px solid rgba(255,240,220,0.14);
  border-radius: 22px;
  padding: 14px 0;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  width: 56px;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.time-pill.search-hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-50%) translateX(-8px);
}
.pill-time {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px; font-weight: 600;
  color: #FFF5E6; letter-spacing: -0.5px;
  line-height: 1; text-align: center;
  white-space: nowrap; width: 100%;
}
.pill-status {
  font-size: 18px; line-height: 1;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.slider-track {
  position: relative;
  width: 4px; height: 130px;
  background: rgba(255,240,220,0.14);
  border-radius: 2px;
  cursor: pointer;
  touch-action: none;
}
.slider-fill {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: #E8890C; border-radius: 2px;
}
.slider-thumb {
  position: absolute; left: 50%;
  transform: translateX(-50%);
  width: 22px; height: 22px;
  background: radial-gradient(circle at 38% 38%, #FFE07A, #E8890C);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(232,137,12,0.25), 0 0 12px rgba(232,137,12,0.5);
}

/* ── VENUE CARD — bottom sheet ── */
.venue-card {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 1000;
  background: #FFFFFF;
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 24px 24px 0 0;
  overflow: hidden;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.18), 0 -1px 0 rgba(0,0,0,0.06);
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(0.34, 1.2, 0.64, 1);
  pointer-events: none;
  padding-bottom: calc(env(safe-area-inset-bottom) + 8px);
}
.venue-card.visible {
  transform: translateY(0);
  pointer-events: all;
}

.card-handle {
  width: 36px; height: 4px;
  background: rgba(0,0,0,0.12);
  border-radius: 2px;
  margin: 12px auto 0;
}

.venue-card-photo {
  width: 100%; height: 140px;
  object-fit: cover;
  display: block;
}
.venue-card-header {
  padding: 10px 20px 10px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.venue-card.has-photo .venue-card-header {
  position: relative;
  padding: 0;
  border-bottom: none;
}
.venue-card.has-photo .venue-card-header-inner {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 12px 20px 14px;
  background: linear-gradient(transparent, rgba(28,20,16,0.95));
}
.venue-card:not(.has-photo) .venue-card-header-inner {
  padding: 12px 20px 14px;
}
/* FIX 3: has-photo mode — name/type/status need light colours on dark overlay */
.venue-card.has-photo .venue-name  { color: #FFFFFF; }
.venue-card.has-photo .venue-type  { color: rgba(255,255,255,0.65); }
.venue-card.has-photo .venue-status-txt.shade { color: rgba(255,255,255,0.7); }

.venue-card-status {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.status-dot.sun   { background: #E8890C; box-shadow: 0 0 6px rgba(232,137,12,0.7); }
.status-dot.shade { background: #b0a090; }
.venue-status-txt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
.venue-status-txt.sun   { color: #E8890C; }
.venue-status-txt.shade { color: #8a7a6a; }
.venue-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 600; color: #1a0e08; margin-bottom: 2px;
}
.venue-type { font-size: 13px; color: rgba(28,20,16,0.55); font-weight: 400; }

.venue-card-body { padding: 10px 20px 14px; }
.sun-schedule {
  background: #FFF3E0;
  border: 1px solid rgba(232,137,12,0.15);
  border-radius: 12px; padding: 10px 14px; margin-bottom: 12px;
}
.sun-schedule-title {
  font-size: 10px; color: rgba(28,20,16,0.5);
  text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; font-weight: 600;
}
.sun-slots { display: flex; flex-direction: column; gap: 10px; }
.sun-slot  { display: flex; flex-direction: column; gap: 6px; }
.slot-times { display: flex; justify-content: space-between; align-items: center; }
.slot-time-label { font-size: 13px; font-weight: 600; color: #E8890C; }
.slot-arrow { font-size: 11px; color: rgba(28,20,16,0.25); }
.slot-bar-wrap {
  position: relative; height: 6px; border-radius: 3px;
  background: rgba(28,20,16,0.08);
}
.slot-fill {
  position: absolute; top: 0; height: 100%;
  border-radius: 3px; background: #E8890C;
}
.slot-now-line {
  position: absolute; top: -3px; width: 2px; height: 12px;
  background: #fff; border-radius: 1px; opacity: 0.8;
}
.slot-day-labels {
  display: flex; justify-content: space-between;
  font-size: 9px; color: rgba(28,20,16,0.45);
  margin-top: 2px;
}

.venue-cta { display: flex; gap: 10px; }
.btn-directions, .btn-reserve {
  flex: 1; padding: 14px 10px; border-radius: 14px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; text-align: center;
  font-family: 'Outfit', sans-serif;
  -webkit-tap-highlight-color: transparent;
  border: none;
}
.btn-directions {
  background: #f5f0eb;
  border: 1.5px solid rgba(0,0,0,0.12);
  color: rgba(28,20,16,0.8);
}
.btn-directions:active { background: #ece6df; }
.btn-reserve { background: #E8890C; color: #0d1117; }
.btn-reserve:active { background: #FFA928; }

.venue-card-close {
  position: absolute; top: 14px; right: 14px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(28,20,16,0.12); border: none;
  color: #1C1410; font-size: 16px; font-weight: 700; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 2000;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.venue-card-close:active { background: rgba(28,20,16,0.2); }

/* ── CARD BACKDROP ── */
#cardBackdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: transparent;
}
#cardBackdrop.visible { display: block; }

/* ── TOAST ── */
#toast {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom) + 20px);
  left: 50%; transform: translateX(-50%) translateY(8px);
  background: rgba(28,20,16,0.95);
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 12px; padding: 10px 20px;
  font-size: 14px; color: #FFF5E6;
  z-index: 500; pointer-events: none; opacity: 0;
  transition: opacity .25s, transform .25s;
  white-space: nowrap; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── ZOOM HINT ── */
#zoomHint {
  position: fixed;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  background: rgba(22,14,10,0.90);
  border: 1px solid rgba(255,184,0,0.18);
  border-radius: 20px;
  padding: 14px 24px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease;
  white-space: nowrap;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}
#zoomHint.visible { opacity: 1; }
.hint-legend {
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,245,230,0.90);
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hint-pin {
  width: 13px; height: 13px;
  border-radius: 50%;
  border: 2px solid #fff;
  display: inline-block;
  flex-shrink: 0;
}
.hint-pin.sun {
  background: #FFB800;
  box-shadow: 0 0 0 2px rgba(255,184,0,0.3);
}
.hint-pin.shade {
  background: #6b88b5;
}
.hint-sep {
  color: rgba(255,245,230,0.3);
  font-weight: 300;
}
.hint-divider {
  width: 100%;
  height: 1px;
  background: rgba(255,255,255,0.08);
  margin-bottom: 9px;
}
.hint-invite {
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-style: normal;
  font-weight: 400;
  color: rgba(255,184,0,0.85);
  letter-spacing: 0.04em;
  line-height: 1;
}

/* ── LANG TOGGLE ── */
.lang-toggle {
  flex-shrink: 0;
  background: rgba(255,255,255,0.92);
  border: none;
  border-radius: 10px;
  padding: 3px;
  display: flex;
  gap: 2px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.10), inset 0 0 0 0.5px rgba(0,0,0,0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  align-self: center;
  height: 44px;
  align-items: center;
}
.lang-btn {
  padding: 0 10px;
  height: 100%;
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 500;
  border: none;
  background: transparent;
  color: rgba(0,0,0,0.35);
  cursor: pointer;
  letter-spacing: 0.4px;
  border-radius: 8px;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.18s ease;
}
.lang-btn.active {
  background: #fff;
  color: #1a1a2e;
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(0,0,0,0.10);
}
.lang-btn:not(.active):hover { color: rgba(0,0,0,0.6); }

/* ── WEATHER PILL ── */
#weatherPill {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 62px);
  right: 12px;
  z-index: 100;
  background: rgba(22,14,10,0.82);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 10px;
  padding: 7px 11px;
  display: flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}
#weatherPill.visible {
  opacity: 1;
  visibility: visible;
}
#weatherPill.search-hidden {
  opacity: 0 !important;
  pointer-events: none;
}
.weather-icon {
  font-size: 13px;
  line-height: 1;
  flex-shrink: 0;
}
.weather-text {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: rgba(255,245,230,0.80);
  letter-spacing: 0.02em;
  line-height: 1.3;
  white-space: nowrap;
}
.weather-text strong {
  color: rgba(255,245,230,0.95);
  font-weight: 500;
}
</style>
</head>
<body>

<div id="map"></div>

<!-- Search -->
<div class="top-bar">
  <div class="search-wrap">
    <div class="s-icon">🔍</div>
    <input id="searchInput" type="text" placeholder="Bar, restaurant, adresse…" autocomplete="off" spellcheck="false">
    <div id="spinner"></div>
    <div id="ac-list"></div>
  </div>
  <button class="geo-btn" id="geoBtn">🎯</button>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnFR" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" id="btnEN" onclick="setLang('en')">EN</button>
  </div>
</div>

<!-- Weather pill -->
<div id="weatherPill">
  <span class="weather-icon" id="weatherIcon">⛅</span>
  <span class="weather-text" id="weatherText"></span>
</div>

<!-- Time pill -->
<div class="time-pill">
  <div class="pill-time" id="timeTxt">12:00</div>
  <div class="pill-status" id="statusEmoji">☀️</div>
  <div class="slider-track" id="sliderTrack">
    <div class="slider-fill" id="sliderFill"></div>
    <div class="slider-thumb" id="sliderThumb"></div>
  </div>
</div>

<!-- FIX 4: Venue card HTML — was completely absent from the body -->
<div id="cardBackdrop"></div>
<div class="venue-card" id="venueCard">
  <button class="venue-card-close" onclick="closeVenueCard()">✕</button>
  <div class="card-handle"></div>
  <div class="venue-card-header" id="vcHeader">
    <img class="venue-card-photo" id="vcPhoto" src="" alt="" style="display:none">
    <div class="venue-card-header-inner">
      <div class="venue-card-status">
        <div class="status-dot" id="vcDot"></div>
        <span class="venue-status-txt" id="vcStatus"></span>
        <span class="venue-walk-sep" id="vcWalkSep" style="display:none;opacity:0.35;margin:0 4px;font-size:11px;">·</span>
        <span class="venue-walk-txt" id="vcWalk" style="display:none;font-size:11px;font-weight:500;color:rgba(28,20,16,0.55);"></span>
      </div>
      <div class="venue-name" id="vcName"></div>
      <div class="venue-type" id="vcType"></div>
    </div>
  </div>
  <div class="venue-card-body">
    <div class="sun-schedule">
      <div class="sun-schedule-title" id="sunSchedTitle">☀️ Soleil aujourd'hui</div>
      <div class="sun-slots" id="vcSlots"></div>
    </div>
    <div class="venue-cta">
      <button class="btn-directions" id="vcDir">🗺 Itinéraire</button>
      <button class="btn-reserve" id="vcRes">Réserver</button>
    </div>
  </div>
</div>

<div id="zoomHint">
  <div class="hint-legend" id="hintLegend">
    <span class="hint-pin sun"></span>au soleil
    <span class="hint-sep">·</span>
    <span class="hint-pin shade"></span>à l'ombre
  </div>
  <div class="hint-divider"></div>
  <div class="hint-invite" id="hintInvite">Zoomez et explorez le soleil heure par heure</div>
</div>
<div id="toast"></div>

<script>

// ── I18N
const i18n = {
  fr: {
    searchPlaceholder: 'Bar, restaurant, adresse…',
    hintLegendSun: 'au soleil',

function getWeatherCondition(id) {
  // OpenWeatherMap weather condition codes
  // 2xx = thunderstorm, 3xx = drizzle, 5xx = rain, 6xx = snow, 7xx = atmosphere, 800 = clear, 8xx = clouds
  if (id >= 200 && id < 300) return 'storm';
  if (id >= 300 && id < 600) return 'rain';
  if (id >= 600 && id < 700) return 'snow';
  if (id >= 700 && id < 800) return 'fog';
  if (id === 800)             return 'clear';
  if (id > 800)               return 'cloudy';
  return 'clear';
}

function getWeatherEmoji(condition) {
  return { storm:'⛈', rain:'🌧', snow:'🌨', fog:'🌫', cloudy:'⛅', clear:'☀️' }[condition] || '⛅';
}

function getWeatherLabel(condition) {
  return {
    storm:  t('weatherStorm'),
    rain:   t('weatherRain'),
    snow:   t('weatherSnow'),
    fog:    t('weatherFog'),
    cloudy: t('weatherCloudy'),
  }[condition];
}

function showWeatherPill(weatherId, tempC) {
  lastWeatherId = weatherId;
  lastTempC = tempC;
  const condition = getWeatherCondition(weatherId);
  const emoji = getWeatherEmoji(condition);
  const tempStr = tempC !== null ? Math.round(tempC) + '°C' : '';

  document.getElementById('weatherIcon').textContent = emoji;

  if (condition === 'clear') {
    // Sunny: just temp, no extra phrase
    document.getElementById('weatherText').textContent = tempStr;
  } else {
    // Bad weather: temp + explanatory phrase
    const label = getWeatherLabel(condition);
    document.getElementById('weatherText').innerHTML =
      tempStr
        + ' <span style="opacity:0.45;margin:0 3px">·</span>'
        + t('weatherPotential');

  document.getElementById('weatherPill').classList.add('visible');
}

// ── SUN LIGHT
function updateSunLightAt(m) {
  if (!map.isStyleLoaded()) return;

  const d = new Date();
  d.setHours(Math.floor(m / 60), Math.floor(m % 60), Math.round((m % 1) * 60), 0);
  const pos = SunCalc.getPosition(d, lat, lng);
  const alt = toDeg(pos.altitude);
  const az  = toDeg(pos.azimuth);

  const mapboxAz = ((-90 - az) % 360 + 360) % 360;
  const polar    = Math.max(1, Math.min(90, 90 - alt));

  let color, intensity;
  if (alt < -6) {
    color = '#070d1f'; intensity = 0.05;
  } else if (alt <= 0) {
    const tDawn = (alt + 6) / 6;
    color = `hsl(25, 40%, ${15 + tDawn*20}%)`; intensity = 0.1 + tDawn * 0.3;
  } else if (alt < 15) {
    const tRise = alt / 15;
    color = `hsl(${35 + tRise*10}, ${80 - tRise*20}%, ${55 + tRise*15}%)`; intensity = 0.4 + tRise * 0.4;
  } else {
    color = '#fff8f0'; intensity = 0.85;
  }

  try {
    map.setLights([
      { id: 'ambient', type: 'ambient',     properties: { color: color, intensity: intensity * 0.4 } },
      { id: 'sun',     type: 'directional', properties: {
        color: color,
        intensity: intensity,
        direction: [mapboxAz, polar],
        'shadow-intensity': alt > 0 ? Math.min(1, alt / 30 + 0.3) : 0,
        'cast-shadows': true,
      }},
    ]);
  } catch(e) {}
}

// ── ANIMATION LOOP
let targetMins = mins;
let renderedMins = mins;
let lastAppliedMins = -1; // track last value sent to setLights
let rafId = null;
let frameCount = 0;

function animLoop() {
  frameCount++;

  // Interpolation always runs — smooth regardless of zoom
  const diff = targetMins - renderedMins;
  if (Math.abs(diff) > 0.02) {
    renderedMins += diff * 0.15;
  } else {
    renderedMins = targetMins;
  }

  // setLights: only when zoomed in, not paused, style ready,
  // AND value has actually changed by at least 0.1 min (~6 seconds of sun movement)
  const canUpdate = !zoomPaused && isDeepZoom() && map.isStyleLoaded();
  const hasChanged = Math.abs(renderedMins - lastAppliedMins) > 0.1;
  // Also do a periodic refresh every ~2s to recover from Mapbox style reloads
  const periodicRefresh = canUpdate && frameCount % 120 === 0;

  if (canUpdate && (hasChanged || periodicRefresh)) {
    try {
      updateSunLightAt(renderedMins);
      lastAppliedMins = renderedMins;
    } catch(e) {}
  }

  rafId = requestAnimationFrame(animLoop);
}

function startAnimLoop() {
  if (rafId) return;
  rafId = requestAnimationFrame(animLoop);
}

function go() {
  updateStatus();

  targetMins = mins;

function getSunSlots(venue) {
  const DAY_START = 7, DAY_END = 21, DAY_SPAN = DAY_END - DAY_START;
  const nowH = mins / 60;
  return venue.sunWindows.map(([start, end]) => {
    const fmt = h => `${String(Math.floor(h)).padStart(2,'0')}:${h%1===0.5?'30':'00'}`;
    const left  = Math.max(0, ((start - DAY_START) / DAY_SPAN) * 100);
    const width = Math.min(((end - start) / DAY_SPAN) * 100, 100 - left);
    const nowPct = ((nowH - DAY_START) / DAY_SPAN) * 100;
    const showNow = nowH >= DAY_START && nowH <= DAY_END;
    return { startStr: fmt(start), endStr: fmt(end), left, width, nowPct, showNow };
  });
}

}

function addVenueMarkers() {
  VENUES.forEach(venue => {
    const inSun = venueInSun(venue);
    const el = makePin(venue, inSun);
    const marker = new mapboxgl.Marker({ element: el, anchor: 'center' })
      .setLngLat([venue.lng, venue.lat])
      .addTo(map);
    el.addEventListener('click', e => {
      e.stopPropagation();
      openVenueCard(venue);
    });
    venueMarkers[venue.id] = { marker, el };
  });
}

function updateVenuePins() {
  VENUES.forEach(venue => {
    const v = venueMarkers[venue.id];
    if (!v) return;
    const inSun = venueInSun(venue);
    v.el.style.background = inSun ? '#FFB800' : '#6b88b5';
    // FIX 5: also update box-shadow and animation when pin state changes
    v.el.style.boxShadow = inSun
      ? '0 2px 10px rgba(0,0,0,0.22), 0 0 0 4px rgba(255,184,0,0.3)'
      : '0 2px 10px rgba(0,0,0,0.22)';
    v.el.style.animation = inSun ? 'pinGlow 2.5s ease-in-out infinite' : 'none';
  });
  if (currentVenue) updateVenueCard(currentVenue);
}

// ── VENUE CARD
let currentVenue = null;

function closeVenueCard() {
  const card = document.getElementById('venueCard');
  card.style.transform = '';
  card.classList.remove('visible');
  document.getElementById('cardBackdrop').classList.remove('visible');
  currentVenue = null;
  // Let updateZoomMode decide pill visibility based on current zoom
  updateZoomMode();
}

function openVenueCard(venue) {
  currentVenue = venue;
  updateVenueCard(venue);
  trackClick(venue.id, 'card_view');
  fetchWalkTime(venue);
  document.getElementById('venueCard').classList.add('visible');
  document.getElementById('cardBackdrop').classList.add('visible');
  // Fly to venue but never zoom out below shadow threshold
  const targetZoom = Math.max(map.getZoom(), SHADOW_ZOOM);
  map.flyTo({
    center: [venue.lng, venue.lat],
    zoom: targetZoom,
    duration: 800,
    offset: [0, -120],
    essential: true,
  });
}

function updateVenueCard(venue) {
  const inSun = venueInSun(venue);
  document.getElementById('vcName').textContent = venue.name;
  document.getElementById('vcType').textContent = venue.type;

  const card = document.getElementById('venueCard');
  const photo = document.getElementById('vcPhoto');
  if (venue.photoUrl) {
    photo.src = venue.photoUrl;
    photo.style.display = 'block';
    card.classList.add('has-photo');
  } else {
    photo.src = '';
    photo.style.display = 'none';
    card.classList.remove('has-photo');
  }

  const dot = document.getElementById('vcDot');
  const statusTxt = document.getElementById('vcStatus');
  dot.className = 'status-dot ' + (inSun ? 'sun' : 'shade');
  statusTxt.className = 'venue-status-txt ' + (inSun ? 'sun' : 'shade');
  statusTxt.textContent = inSun ? t('inSun') : t('inShade');

  const slots = getSunSlots(venue);
  const slotsEl = document.getElementById('vcSlots');
  slotsEl.innerHTML = slots.map(s => `
    <div class="sun-slot">
      <div class="slot-times">
        <span class="slot-time-label">☀️ ${s.startStr}</span>
        <span class="slot-arrow">——</span>
        <span class="slot-time-label">${s.endStr} ☀️</span>
      </div>
      <div class="slot-bar-wrap">
        <div class="slot-fill" style="left:${s.left}%;width:${s.width}%"></div>
        ${s.showNow ? `<div class="slot-now-line" style="left:${s.nowPct}%"></div>` : ''}
      </div>
      <div class="slot-day-labels"><span>7h</span><span>14h</span><span>21h</span></div>
    </div>
  `).join('');

  document.getElementById('vcDir').onclick = () => { trackClick(venue.id, 'directions_click'); window.open(venue.directionsUrl, '_blank'); };
  document.getElementById('vcRes').onclick = () => { trackClick(venue.id, 'reserve_click'); window.open(venue.reserveUrl, '_blank'); };
}

// Swipe to close
(function() {
  const card = document.getElementById('venueCard');
  let startY = 0, active = false, moved = 0;

  card.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    active = true;
    moved = 0;
    card.style.transition = 'none';
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    if (!active) return;
    moved = e.touches[0].clientY - startY;
    if (moved > 0) card.style.transform = 'translateY(' + moved + 'px)';
  }, { passive: true });

  card.addEventListener('touchend', () => {
    if (!active) return;
    active = false;
    card.style.transition = '';
    if (moved > 70) closeVenueCard();
    else card.style.transform = '';
  }, { passive: true });
})();

document.getElementById('cardBackdrop').addEventListener('click', closeVenueCard);
document.getElementById('cardBackdrop').addEventListener('touchend', e => {
  e.preventDefault();
  closeVenueCard();
});

</script>
