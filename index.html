<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; height: 100dvh;
  overflow: hidden;
  font-family: 'Outfit', sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#map { position: absolute; inset: 0; }

/* Mapbox controls — push above safe area */
.mapboxgl-ctrl-group {
  background: rgba(255,255,255,0.92) !important;
  border: 1px solid rgba(0,0,0,0.08) !important;
}
.mapboxgl-ctrl-attrib { font-size: 9px !important; }
.mapboxgl-ctrl-bottom-right {
  bottom: calc(env(safe-area-inset-bottom) + 16px) !important;
  right: 12px !important;
}

/* ── SEARCH BAR ── */
.top-bar {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 12px);
  left: 12px; right: 12px;
  z-index: 100;
  display: flex;
  gap: 10px;
  align-items: center;
}
.search-wrap { position: relative; flex: 1; }
#searchInput {
  width: 100%;
  background: rgba(255,255,255,0.97);
  border: 1.5px solid rgba(0,0,0,0.08);
  border-radius: 14px;
  padding: 14px 44px 14px 16px;
  font-family: 'Outfit', sans-serif;
  font-size: 16px; /* 16px prevents iOS zoom on focus */
  color: #1a1a2e;
  outline: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  -webkit-appearance: none;
}
#searchInput::placeholder { color: rgba(0,0,0,0.3); }
#searchInput:focus { border-color: #FFB800; }
.s-icon {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); font-size: 18px;
  pointer-events: none; opacity: .35;
}
#spinner {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%);
  width: 18px; height: 18px;
  border: 2px solid rgba(0,0,0,0.08);
  border-top-color: #FFB800;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

#ac-list {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: rgba(255,255,255,0.99);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 12px 36px rgba(0,0,0,0.14);

}
.ac-item {

  border-bottom: 1px solid rgba(0,0,0,0.04);
  -webkit-tap-highlight-color: rgba(255,184,0,0.1);
}
.ac-item:last-child { border-bottom: none; }
.ac-item:active { background: rgba(255,184,0,0.08); }
.ac-name { font-size: 15px; font-weight: 500; color: #1a1a2e; }
.ac-addr { font-size: 12px; color: rgba(0,0,0,0.35); margin-top: 3px; }

.geo-btn {
  width: 52px; height: 52px;
  border-radius: 14px; flex-shrink: 0;
  background: rgba(255,255,255,0.97);
  border: 1.5px solid rgba(0,0,0,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  -webkit-tap-highlight-color: transparent;
}
.geo-btn:active { background: rgba(255,184,0,0.12); }

/* ── TIME PILL ── */
.time-pill {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  background: rgba(12,15,30,0.9);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 22px;
  padding: 14px 0;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  width: 56px;
}
.pill-time {
  font-family: 'Playfair Display', serif;
  font-size: 15px; font-weight: 600;
  color: #fff; letter-spacing: -0.5px;
  line-height: 1; text-align: center;
  white-space: nowrap; width: 100%;
}
.pill-status {
  font-size: 18px; line-height: 1;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.slider-track {
  position: relative;
  width: 4px; height: 130px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px;
  cursor: pointer;
  touch-action: none;
}
.slider-fill {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: #FFB800; border-radius: 2px;
}
.slider-thumb {
  position: absolute; left: 50%;
  transform: translateX(-50%);
  width: 22px; height: 22px;
  background: radial-gradient(circle at 38% 38%, #ffe07a, #FFB800);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(255,184,0,0.25), 0 0 12px rgba(255,184,0,0.5);
}
.pill-sun {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  font-size: 10px; color: rgba(255,255,255,0.45);
  text-align: center; line-height: 1.3; width: 100%;
}
.pill-sun b {
  color: rgba(255,255,255,0.75);
  font-weight: 500; display: block;
  font-size: 10px; white-space: nowrap;
}

/* ── VENUE PINS ── */
.venue-pin {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  border: 3px solid #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
.venue-pin.in-sun {
  background: #FFB800;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3), 0 0 0 4px rgba(255,184,0,0.3);
  animation: pinPulse 2s ease-in-out infinite;
}
.venue-pin.in-shade { background: #4a5a8a; }
@keyframes pinPulse {
  0%,100% { box-shadow: 0 2px 12px rgba(0,0,0,0.3), 0 0 0 4px rgba(255,184,0,0.3); }
  50% { box-shadow: 0 2px 12px rgba(0,0,0,0.3), 0 0 0 10px rgba(255,184,0,0); }
}

/* ── VENUE CARD — bottom sheet on mobile ── */
.venue-card {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 1000;
  background: rgba(12,15,30,0.98);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px 24px 0 0;
  overflow: visible;
  box-shadow: 0 -4px 40px rgba(0,0,0,0.4);
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(0.34, 1.2, 0.64, 1);
  pointer-events: none;
  padding-bottom: calc(env(safe-area-inset-bottom) + 8px);
}
.venue-card.visible {
  transform: translateY(0);
  pointer-events: all;
}

/* drag handle */
.card-handle {
  width: 36px; height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  margin: 12px auto 0;
}

.venue-card-header {
  padding: 12px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.venue-card-status {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.status-dot.sun { background: #FFB800; box-shadow: 0 0 6px rgba(255,184,0,0.7); }
.status-dot.shade { background: #4a5a8a; }
.venue-status-txt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
.venue-status-txt.sun { color: #FFB800; }
.venue-status-txt.shade { color: #8a9abf; }
.venue-name {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 2px;
}
.venue-type { font-size: 12px; color: rgba(255,255,255,0.4); }

.venue-card-body { padding: 14px 20px 16px; }
.sun-schedule {
  background: rgba(255,255,255,0.04);
  border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
}
.sun-schedule-title {
  font-size: 10px; color: rgba(255,255,255,0.35);
  text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px;
}
.sun-slots { display: flex; flex-direction: column; gap: 6px; }
.sun-slot { display: flex; align-items: center; gap: 8px; }
.slot-bar {
  flex: 1; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.08); overflow: hidden;
}
.slot-fill { height: 100%; border-radius: 2px; background: #FFB800; }
.slot-time { font-size: 11px; color: rgba(255,255,255,0.5); white-space: nowrap; }

.venue-cta { display: flex; gap: 10px; }
.btn-directions, .btn-reserve {
  flex: 1; padding: 14px 10px; border-radius: 14px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; text-align: center;
  font-family: 'Outfit', sans-serif;
  -webkit-tap-highlight-color: transparent;
  border: none;
}
.btn-directions {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.75);
}
.btn-directions:active { background: rgba(255,255,255,0.14); }
.btn-reserve { background: #FFB800; color: #0d1117; }
.btn-reserve:active { background: #ffc82a; }

.venue-card-close {
  position: absolute; top: 14px; right: 14px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.12); border: none;
  color: #fff; font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 2000;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.venue-card-close:active { background: rgba(255,255,255,0.25); }

/* ── CARD BACKDROP ── */
#cardBackdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: transparent;
}
#cardBackdrop.visible { display: block; }

/* ── TOAST ── */
#toast {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom) + 20px);
  left: 50%; transform: translateX(-50%) translateY(8px);
  background: rgba(12,15,30,0.95);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 10px 20px;
  font-size: 14px; color: #fff;
  z-index: 500; pointer-events: none; opacity: 0;
  transition: opacity .25s, transform .25s;
  white-space: nowrap; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Rotation hint */
#rotHint {
  bottom: calc(env(safe-area-inset-bottom) + 20px) !important;
}
</style>
</head>
<body>

<div id="map"></div>

<!-- Search -->
<div class="top-bar">
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Bar, restaurant, address…" autocomplete="off" spellcheck="false">
    <div class="s-icon">🔍</div>
    <div id="spinner"></div>
    <div id="ac-list"></div>
  </div>
  <button class="geo-btn" id="geoBtn">🎯</button>
</div>

<!-- Time pill -->
<div class="time-pill">
  <div class="pill-time" id="timeTxt">12:00</div>
  <div class="pill-status" id="statusEmoji">☀️</div>
  <div class="slider-track" id="sliderTrack">
    <div class="slider-fill" id="sliderFill"></div>
    <div class="slider-thumb" id="sliderThumb"></div>
  </div>
  <div class="pill-sun">
    🌅 <b id="rise">–</b>
    🌇 <b id="sset">–</b>
  </div>
</div>


<!-- Rotation hint -->
<div id="rotHint" style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;background:rgba(12,15,30,0.82);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:7px 14px;font-size:11px;color:rgba(255,255,255,0.55);pointer-events:none;animation:fadeHint 4s ease 1s both;white-space:nowrap">
  🖱️ Right-click + drag to rotate · 👌 Two fingers on mobile
</div>
<div id="toast"></div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiZ2FicmllbG1hc3NvdGIiLCJhIjoiY21vZXI0amxnMGkydjJxcHlxNjRnNnRpaCJ9.z-osiZTamzQl6KATKftMaA';

let lat = 45.5088, lng = -73.5878;
let mins = new Date().getHours() * 60 + new Date().getMinutes();
let toastTmt, acTimeout, dragging = false;

// ── MAP
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  center: [lng, lat],
  zoom: 16,
  pitch: 45,
  antialias: true,
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: true }), 'bottom-right');

// ── SOLAR
function getDate() { const d = new Date(); d.setHours(~~(mins/60), mins%60, 0, 0); return d; }
function sunPos()   { return SunCalc.getPosition(getDate(), lat, lng); }
function sunTimes() { return SunCalc.getTimes(new Date(), lat, lng); }
function fmt(d)     { return (!d||isNaN(d)) ? '–' : d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); }
function toDeg(r)   { return r * 180 / Math.PI; }

// ── SUN LIGHT
function updateSunLight() {
  if (!map.isStyleLoaded()) return;
  const pos = sunPos(), alt = toDeg(pos.altitude), az = toDeg(pos.azimuth);
  const mapboxAz = ((-90 - az) % 360 + 360) % 360;
  const polar = Math.max(2, Math.min(90, 90 - alt));

  if (alt < -6) {
    map.setLights([
      { id: 'ambient', type: 'ambient', properties: { color: '#0a1535', intensity: 0.3 } },
      { id: 'sun', type: 'directional', properties: { color: '#0a1535', intensity: 0, direction: [mapboxAz, polar], 'shadow-intensity': 0 } },
    ]);
  } else if (alt <= 0) {
    const t = (alt + 6) / 6;
    map.setLights([
      { id: 'ambient', type: 'ambient', properties: { color: '#1a2040', intensity: 0.4 } },
      { id: 'sun', type: 'directional', properties: { color: `hsl(25,60%,${40+t*20}%)`, intensity: 0.3*t, direction: [mapboxAz, polar], 'shadow-intensity': 0.3*t } },
    ]);
  } else if (alt < 15) {
    const t = alt / 15;
    map.setLights([
      { id: 'ambient', type: 'ambient', properties: { color: '#fff3d0', intensity: 0.4 } },
      { id: 'sun', type: 'directional', properties: { color: `hsl(${30+t*10},${90-t*20}%,${65+t*10}%)`, intensity: 0.5+t*0.3, direction: [mapboxAz, polar], 'shadow-intensity': 0.85 } },
    ]);
  } else {
    map.setLights([
      { id: 'ambient', type: 'ambient', properties: { color: '#fff8f0', intensity: 0.35 } },
      { id: 'sun', type: 'directional', properties: { color: '#ffffff', intensity: 0.85, direction: [mapboxAz, polar], 'shadow-intensity': 1.0 } },
    ]);
  }
}

// ── SLIDER (custom vertical — plus fiable que input[type=range] vertical)
const track = document.getElementById('sliderTrack');
const fill  = document.getElementById('sliderFill');
const thumb = document.getElementById('sliderThumb');

function updateSliderUI() {
  const pct = mins / 1439; // 0=00h, 1=23h59
  const trackH = track.offsetHeight;
  const thumbH = thumb.offsetHeight;
  const pos = (1 - pct) * (trackH - thumbH); // 0h en bas, 23h en haut
  thumb.style.top = pos + 'px';
  fill.style.height = (pct * trackH) + 'px';
}

function pxToMins(clientY) {
  const rect = track.getBoundingClientRect();
  const pct = 1 - Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
  return Math.round(pct * 1439);
}

track.addEventListener('mousedown', e => {
  dragging = true;
  mins = pxToMins(e.clientY);
  updateSliderUI(); go();
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  mins = pxToMins(e.clientY);
  updateSliderUI(); go();
});
document.addEventListener('mouseup', () => { dragging = false; });

// Touch
track.addEventListener('touchstart', e => {
  dragging = true;
  mins = pxToMins(e.touches[0].clientY);
  updateSliderUI(); go();
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (!dragging) return;
  mins = pxToMins(e.touches[0].clientY);
  updateSliderUI(); go();
}, { passive: false });
document.addEventListener('touchend', () => { dragging = false; });

// ── STATUS
function updateStatus() {
  const alt = toDeg(sunPos().altitude);
  const emoji = document.getElementById('statusEmoji');
  if      (alt < -6)  emoji.textContent = '🌙';
  else if (alt <= 0)  emoji.textContent = '🌅';
  else if (alt < 10)  emoji.textContent = '🌤️';
  else                emoji.textContent = '☀️';

  const h = String(~~(mins/60)).padStart(2,'0');
  const m = String(mins%60).padStart(2,'0');
  document.getElementById('timeTxt').textContent = h + ':' + m;
  const t = sunTimes();
  document.getElementById('rise').textContent = fmt(t.sunrise);
  document.getElementById('sset').textContent = fmt(t.sunset);
}

function go() { updateStatus(); updateSunLight(); updateVenuePins(); }

// ── MAP LOAD
map.on('style.load', () => {
  map.setConfigProperty('basemap', 'show3dObjects', true);
  updateSliderUI();
  go();
  addVenueMarkers();
});

// ── GEOLOC
document.getElementById('geoBtn').addEventListener('click', () => {
  if (!navigator.geolocation) return showToast('Not supported');
  showToast('📡 Locating…');
  navigator.geolocation.getCurrentPosition(p => {
    lat = p.coords.latitude; lng = p.coords.longitude;
    map.flyTo({ center: [lng, lat], zoom: 16, duration: 1200 });
    go(); showToast('🎯 Location found!');
  }, () => showToast('❌ Access denied'));
});



map.on('click', e => {
  // Don't fire if user tapped on the venue card or any overlay UI
  const card = document.getElementById('venueCard');
  if (card.classList.contains('visible')) {
    // Let card handle its own events
    return;
  }
  lng = e.lngLat.lng; lat = e.lngLat.lat;
  showToast('📍 Location updated');
});

// ── SEARCH
const si=document.getElementById('searchInput'),acList=document.getElementById('ac-list'),spn=document.getElementById('spinner'),sico=document.querySelector('.s-icon');
si.addEventListener('input',()=>{
  clearTimeout(acTimeout); const q=si.value.trim();
  if(q.length<2){acList.style.display='none';return;}
  acTimeout=setTimeout(()=>fetchPlaces(q),300);
});
async function fetchPlaces(q){
  spn.style.display='block';sico.style.display='none';
  try{
    const url=`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${mapboxgl.accessToken}&language=fr&limit=6&types=poi,address&proximity=${lng},${lat}&bbox=-74.0,45.3,-73.4,45.7`;
    const res=await fetch(url);const data=await res.json();
    renderAC(data.features||[]);
  }catch{acList.style.display='none';}
  finally{spn.style.display='none';sico.style.display='block';}
}
function renderAC(features){
  if(!features.length){acList.style.display='none';return;}
  acList.innerHTML='';
  features.forEach(f=>{
    const item=document.createElement('div');item.className='ac-item';
    const name=f.text||f.place_name.split(',')[0];
    const addr=f.place_name.split(',').slice(1,3).join(', ').trim();
    item.innerHTML=`<div class="ac-name">${name}</div><div class="ac-addr">${addr}</div>`;
    item.addEventListener('click',()=>{
      lng=f.center[0];lat=f.center[1];si.value=name;acList.style.display='none';

// Check if venue is in sun at current time
function venueInSun(venue) {
  const h = mins / 60; // current hour as float
  return venue.sunWindows.some(([start, end]) => h >= start && h < end);
}

// Compute sun slots for display — merge windows into readable format
function getSunSlots(venue) {
  return venue.sunWindows.map(([start, end]) => {
    const startStr = `${String(Math.floor(start)).padStart(2,'0')}:${start%1===0.5?'30':'00'}`;
    const endStr   = `${String(Math.floor(end)).padStart(2,'0')}:${end%1===0.5?'30':'00'}`;
    const totalDay = 14; // 8h to 22h window
    const left  = ((start - 8) / totalDay) * 100;
    const width = ((end - start) / totalDay) * 100;
    return { startStr, endStr, left: Math.max(0,left), width: Math.min(width, 100-Math.max(0,left)) };
  });
}

// Add venue markers to map
const venueMarkers = {};

function addVenueMarkers() {
  VENUES.forEach(venue => {
    const el = document.createElement('div');
    el.className = 'venue-pin ' + (venueInSun(venue) ? 'in-sun' : 'in-shade');
    el.textContent = venue.emoji;

    // anchor:'center' + explicit fixed size = pin stays locked on coordinates
    const marker = new mapboxgl.Marker({ element: el, anchor: 'center' })
      .setLngLat([venue.lng, venue.lat])
      .addTo(map);

    el.addEventListener('click', e => {
      e.stopPropagation();
      openVenueCard(venue);
    });

    venueMarkers[venue.id] = { marker, el };
  });
}

// Update all venue pins when time changes
function updateVenuePins() {
  VENUES.forEach(venue => {
    const { el } = venueMarkers[venue.id] || {};
    if (!el) return;
    const inSun = venueInSun(venue);
    el.className = 'venue-pin ' + (inSun ? 'in-sun' : 'in-shade');
  });
  if (currentVenue) updateVenueCard(currentVenue);
}

// Open venue card
let currentVenue = null;
function closeVenueCard() {
  const card = document.getElementById('venueCard');
  card.style.transform = '';
  card.classList.remove('visible');
  document.getElementById('cardBackdrop').classList.remove('visible');
  currentVenue = null;
}

function openVenueCard(venue) {
  currentVenue = venue;
  updateVenueCard(venue);
  document.getElementById('venueCard').classList.add('visible');
  document.getElementById('cardBackdrop').classList.add('visible');
  // Smooth zoom to venue, offset center slightly right to leave room for card
  map.flyTo({
    center: [venue.lng, venue.lat],
    zoom: 18,
    duration: 800,
    offset: [-80, 0],
    essential: true,
  });
}

function updateVenueCard(venue) {
  const inSun = venueInSun(venue);
  document.getElementById('vcName').textContent = venue.name;
  document.getElementById('vcType').textContent = venue.type;

  const dot = document.getElementById('vcDot');
  const statusTxt = document.getElementById('vcStatus');
  dot.className = 'status-dot ' + (inSun ? 'sun' : 'shade');
  statusTxt.className = 'venue-status-txt ' + (inSun ? 'sun' : 'shade');
  statusTxt.textContent = inSun ? '☀️ In the sun now' : '🌑 In the shade now';

  // Sun schedule bars
  const slots = getSunSlots(venue);
  const slotsEl = document.getElementById('vcSlots');
  slotsEl.innerHTML = slots.map(s => `
    <div class="sun-slot">
      <span class="slot-time">${s.startStr}</span>
      <div class="slot-bar"><div class="slot-fill" style="margin-left:${s.left}%;width:${s.width}%"></div></div>
      <span class="slot-time">${s.endStr}</span>
    </div>
  `).join('');

  // CTA buttons
  document.getElementById('vcDir').onclick = () => window.open(venue.directionsUrl, '_blank');
  document.getElementById('vcRes').onclick = () => window.open(venue.reserveUrl, '_blank');
}

// Swipe to close - on the whole card
(function() {
  const card = document.getElementById('venueCard');
  let startY = 0, active = false, moved = 0;

  card.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    active = true;
    moved = 0;
    card.style.transition = 'none';
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    if (!active) return;
    moved = e.touches[0].clientY - startY;
    if (moved > 0) {
      card.style.transform = 'translateY(' + moved + 'px)';
    }
  }, { passive: true });

  card.addEventListener('touchend', e => {
    if (!active) return;
    active = false;
    card.style.transition = '';
    if (moved > 70) {
      closeVenueCard();
    } else {
      card.style.transform = '';
    }
  }, { passive: true });
})();


document.getElementById('cardBackdrop').addEventListener('click', closeVenueCard);
document.getElementById('cardBackdrop').addEventListener('touchend', (e) => {
  e.preventDefault();
  closeVenueCard();
});
