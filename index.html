<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: 'Outfit', sans-serif; }
#map { position: absolute; inset: 0; }

/* Mapbox controls */
.mapboxgl-ctrl-group { background: rgba(255,255,255,0.92) !important; border: 1px solid rgba(0,0,0,0.08) !important; }
.mapboxgl-ctrl-attrib { font-size: 9px !important; }

/* ── SEARCH BAR ── */
.top-bar {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 100; display: flex; gap: 10px; align-items: center;
  width: calc(100vw - 32px); max-width: 480px;
}
.search-wrap { position: relative; flex: 1; }
#searchInput {
  width: 100%; background: rgba(255,255,255,0.96);
  border: 1.5px solid rgba(0,0,0,0.1); border-radius: 14px;
  padding: 12px 44px 12px 16px; font-family: 'Outfit', sans-serif;
  font-size: 15px; color: #1a1a2e; outline: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  transition: border-color .2s, box-shadow .2s;
}
#searchInput::placeholder { color: rgba(0,0,0,0.3); }
#searchInput:focus { border-color: #FFB800; box-shadow: 0 0 0 3px rgba(255,184,0,0.18); }
.s-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; opacity: .35; }
#spinner { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; border: 2px solid rgba(0,0,0,0.08); border-top-color: #FFB800; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
@keyframes fadeHint { 0%{opacity:0} 20%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
#ac-list { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: rgba(255,255,255,0.98); border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,0.14); z-index: 500; display: none; }
.ac-item { padding: 11px 16px; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.04); transition: background .15s; }
.ac-item:last-child { border-bottom: none; }
.ac-item:hover { background: rgba(255,184,0,0.07); }
.ac-name { font-size: 14px; font-weight: 500; color: #1a1a2e; }
.ac-addr { font-size: 11px; color: rgba(0,0,0,0.35); margin-top: 2px; }
.geo-btn {
  width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
  background: rgba(255,255,255,0.96); border: 1.5px solid rgba(0,0,0,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; cursor: pointer; transition: all .2s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}
.geo-btn:hover { background: rgba(255,184,0,0.1); border-color: rgba(255,184,0,0.4); }

/* ── TIME PILL (vertical, left side) ── */
.time-pill {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  background: rgba(12, 15, 30, 0.88);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 22px;
  padding: 14px 0;
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  width: 56px;
  flex-shrink: 0;
}

.pill-time {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  letter-spacing: -0.5px;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
  width: 100%;
}

.pill-status {
  font-size: 16px;
  line-height: 1;
  text-align: center;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Vertical slider */
.slider-track {
  position: relative;
  width: 4px;
  height: 120px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px;
  cursor: pointer;
}
.slider-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: #FFB800;
  border-radius: 2px;
  transition: height .05s;
}
.slider-thumb {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 16px;
  background: radial-gradient(circle at 38% 38%, #ffe07a, #FFB800);
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(255,184,0,0.3), 0 0 10px rgba(255,184,0,0.5);
  cursor: grab;
  transition: bottom .05s;
}
.slider-thumb:active { cursor: grabbing; }

.pill-sun {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  color: rgba(255,255,255,0.45);
  text-align: center;
  line-height: 1.3;
  width: 100%;
}
.pill-sun b { color: rgba(255,255,255,0.75); font-weight: 500; display: block; font-size: 10px; white-space: nowrap; }

/* ── TOAST ── */
#toast {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: rgba(12,15,30,0.95); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 9px 18px; font-size: 13px; color: #fff;
  z-index: 200; pointer-events: none; opacity: 0;
  transition: opacity .25s, transform .25s; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── VENUE PINS ── */
.venue-pin {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  cursor: pointer;
  border: 3px solid #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  transition: transform .2s;
  position: relative;
}
.venue-pin:hover { transform: scale(1.12); }
.venue-pin.in-sun { background: #FFB800; animation: pinPulse 2s ease-in-out infinite; }
.venue-pin.in-shade { background: #4a5a8a; }
.venue-pin .pin-badge {
  position: absolute; top: -4px; right: -4px;
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid #fff; font-size: 8px;
  display: flex; align-items: center; justify-content: center;
}
.pin-badge.sun { background: #FFB800; }
.pin-badge.shade { background: #4a5a8a; }
@keyframes pinPulse {
  0%,100% { box-shadow: 0 2px 12px rgba(0,0,0,0.25), 0 0 0 0 rgba(255,184,0,0.4); }
  50% { box-shadow: 0 2px 12px rgba(0,0,0,0.25), 0 0 0 10px rgba(255,184,0,0); }
}

/* ── VENUE CARD ── */
.venue-card {
  position: absolute; bottom: 24px; right: 16px;
  width: 280px; z-index: 200;
  background: rgba(12,15,30,0.97);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  transform: translateY(20px); opacity: 0;
  transition: transform .3s, opacity .3s;
  pointer-events: none;
}
.venue-card.visible { transform: translateY(0); opacity: 1; pointer-events: all; }
.venue-card-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.venue-card-status {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.sun { background: #FFB800; box-shadow: 0 0 6px rgba(255,184,0,0.7); }
.status-dot.shade { background: #4a5a8a; }
.venue-status-txt { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
.venue-status-txt.sun { color: #FFB800; }
.venue-status-txt.shade { color: #8a9abf; }
.venue-name {
  font-family: 'Playfair Display', serif;
  font-size: 20px; font-weight: 600; color: #fff;
  margin-bottom: 3px;
}
.venue-type { font-size: 12px; color: rgba(255,255,255,0.4); }
.venue-card-body { padding: 12px 16px 16px; }
.sun-schedule {
  background: rgba(255,255,255,0.04);
  border-radius: 12px; padding: 10px 12px;
  margin-bottom: 12px;
}
.sun-schedule-title { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
.sun-slots { display: flex; flex-direction: column; gap: 4px; }
.sun-slot {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px;
}
.slot-bar {
  flex: 1; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.08); overflow: hidden;
}
.slot-fill { height: 100%; border-radius: 2px; background: #FFB800; }
.slot-time { font-size: 11px; color: rgba(255,255,255,0.5); white-space: nowrap; }
.venue-cta {
  display: flex; gap: 8px;
}
.btn-directions {
  flex: 1; padding: 9px; border-radius: 10px;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 500;
  cursor: pointer; text-align: center; transition: background .2s;
  font-family: 'Outfit', sans-serif;
}
.btn-directions:hover { background: rgba(255,255,255,0.12); }
.btn-reserve {
  flex: 1; padding: 9px; border-radius: 10px;
  background: #FFB800; border: none;
  color: #0d1117; font-size: 12px; font-weight: 600;
  cursor: pointer; text-align: center; transition: background .2s;
  font-family: 'Outfit', sans-serif;
}
.btn-reserve:hover { background: #ffc82a; }
.venue-card-close {
  position: absolute; top: 12px; right: 12px;
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: none;
  color: rgba(255,255,255,0.5); font-size: 14px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}

</style>
</head>
<body>

<div id="map"></div>

<!-- Search -->
<div class="top-bar">
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Bar, restaurant, address…" autocomplete="off" spellcheck="false">
    <div class="s-icon">🔍</div>
    <div id="spinner"></div>
    <div id="ac-list"></div>
  </div>
  <button class="geo-btn" id="geoBtn">🎯</button>
</div>

<!-- Time pill -->
<div class="time-pill">
  <div class="pill-time" id="timeTxt">12:00</div>
  <div class="pill-status" id="statusEmoji">☀️</div>
  <div class="slider-track" id="sliderTrack">
    <div class="slider-fill" id="sliderFill"></div>
    <div class="slider-thumb" id="sliderThumb"></div>
  </div>
  <div class="pill-sun">
    🌅 <b id="rise">–</b>
    🌇 <b id="sset">–</b>
  </div>
</div>


<!-- Rotation hint -->
<div id="rotHint" style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;background:rgba(12,15,30,0.82);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:7px 14px;font-size:11px;color:rgba(255,255,255,0.55);pointer-events:none;animation:fadeHint 4s ease 1s both;white-space:nowrap">
  🖱️ Right-click + drag to rotate · 👌 Two fingers on mobile
</div>
<div id="toast"></div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiZ2FicmllbG1hc3NvdGIiLCJhIjoiY21vZXI0amxnMGkydjJxcHlxNjRnNnRpaCJ9.z-osiZTamzQl6KATKftMaA';

let lat = 45.5088, lng = -73.5878;
let mins = new Date().getHours() * 60 + new Date().getMinutes();
let toastTmt, acTimeout, dragging = false;

// ── MAP
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  center: [lng, lat],
  zoom: 16,
  pitch: 45,
  antialias: true,
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: true }), 'bottom-right');

// ── SOLAR
function getDate() { const d = new Date(); d.setHours(~~(mins/60), mins%60, 0, 0); return d; }
function sunPos()   { return SunCalc.getPosition(getDate(), lat, lng); }
function sunTimes() { return SunCalc.getTimes(new Date(), lat, lng); }
function fmt(d)     { return (!d||isNaN(d)) ? '–' : d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); }
function toDeg(r)   { return r * 180 / Math.PI; }

// ── SUN LIGHT
function updateSunLight() {
  if (!map.isStyleLoaded()) return;
  const pos = sunPos(), alt = toDeg(pos.altitude), az = toDeg(pos.azimuth);
  const mapboxAz = ((-90 - az) % 360 + 360) % 360;
  const polar = Math.max(2, Math.min(90, 90 - alt));

  if (alt < -6) {
    map.setLights([
      { id: 'ambient', type: 'ambient', properties: { color: '#0a1535', intensity: 0.3 } },
      { id: 'sun', type: 'directional', properties: { color: '#0a1535', intensity: 0, direction: [mapboxAz, polar], 'shadow-intensity': 0 } },
    ]);
  } else if (alt <= 0) {
    const t = (alt + 6) / 6;
    map.setLights([
      { id: 'ambient', type: 'ambient', properties: { color: '#1a2040', intensity: 0.4 } },
      { id: 'sun', type: 'directional', properties: { color: `hsl(25,60%,${40+t*20}%)`, intensity: 0.3*t, direction: [mapboxAz, polar], 'shadow-intensity': 0.3*t } },
    ]);
  } else if (alt < 15) {
    const t = alt / 15;
    map.setLights([
      { id: 'ambient', type: 'ambient', properties: { color: '#fff3d0', intensity: 0.4 } },
      { id: 'sun', type: 'directional', properties: { color: `hsl(${30+t*10},${90-t*20}%,${65+t*10}%)`, intensity: 0.5+t*0.3, direction: [mapboxAz, polar], 'shadow-intensity': 0.85 } },
    ]);
  } else {
    map.setLights([
      { id: 'ambient', type: 'ambient', properties: { color: '#fff8f0', intensity: 0.35 } },
      { id: 'sun', type: 'directional', properties: { color: '#ffffff', intensity: 0.85, direction: [mapboxAz, polar], 'shadow-intensity': 1.0 } },
    ]);
  }
}

// ── SLIDER (custom vertical — plus fiable que input[type=range] vertical)
const track = document.getElementById('sliderTrack');
const fill  = document.getElementById('sliderFill');
const thumb = document.getElementById('sliderThumb');

function updateSliderUI() {
  const pct = mins / 1439; // 0=00h, 1=23h59
  const trackH = track.offsetHeight;
  const thumbH = thumb.offsetHeight;
  const pos = (1 - pct) * (trackH - thumbH); // 0h en bas, 23h en haut
  thumb.style.top = pos + 'px';
  fill.style.height = (pct * trackH) + 'px';
}

function pxToMins(clientY) {
  const rect = track.getBoundingClientRect();
  const pct = 1 - Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
  return Math.round(pct * 1439);
}

track.addEventListener('mousedown', e => {
  dragging = true;
  mins = pxToMins(e.clientY);
  updateSliderUI(); go();
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  mins = pxToMins(e.clientY);
  updateSliderUI(); go();
});
document.addEventListener('mouseup', () => { dragging = false; });

// Touch
track.addEventListener('touchstart', e => {
  dragging = true;
  mins = pxToMins(e.touches[0].clientY);
  updateSliderUI(); go();
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (!dragging) return;
  mins = pxToMins(e.touches[0].clientY);
  updateSliderUI(); go();
}, { passive: false });
document.addEventListener('touchend', () => { dragging = false; });

// ── STATUS
function updateStatus() {
  const alt = toDeg(sunPos().altitude);
  const emoji = document.getElementById('statusEmoji');
  if      (alt < -6)  emoji.textContent = '🌙';
  else if (alt <= 0)  emoji.textContent = '🌅';
  else if (alt < 10)  emoji.textContent = '🌤️';
  else                emoji.textContent = '☀️';

  const h = String(~~(mins/60)).padStart(2,'0');
  const m = String(mins%60).padStart(2,'0');
  document.getElementById('timeTxt').textContent = h + ':' + m;
  const t = sunTimes();
  document.getElementById('rise').textContent = fmt(t.sunrise);
  document.getElementById('sset').textContent = fmt(t.sunset);
}

function go() { updateStatus(); updateSunLight(); updateVenuePins(); }

// ── MAP LOAD
map.on('style.load', () => {
  map.setConfigProperty('basemap', 'show3dObjects', true);
  updateSliderUI();
  go();
  addVenueMarkers();
});

// ── GEOLOC
document.getElementById('geoBtn').addEventListener('click', () => {
  if (!navigator.geolocation) return showToast('Not supported');
  showToast('📡 Locating…');
  navigator.geolocation.getCurrentPosition(p => {
    lat = p.coords.latitude; lng = p.coords.longitude;
    map.flyTo({ center: [lng, lat], zoom: 16, duration: 1200 });
    go(); showToast('🎯 Location found!');
  }, () => showToast('❌ Access denied'));
});

map.on('click', e => { lng = e.lngLat.lng; lat = e.lngLat.lat; showToast('📍 Location updated'); });

// ── SEARCH
const si=document.getElementById('searchInput'),acList=document.getElementById('ac-list'),spn=document.getElementById('spinner'),sico=document.querySelector('.s-icon');
si.addEventListener('input',()=>{
  clearTimeout(acTimeout); const q=si.value.trim();
  if(q.length<2){acList.style.display='none';return;}
  acTimeout=setTimeout(()=>fetchPlaces(q),300);
});
async function fetchPlaces(q){
  spn.style.display='block';sico.style.display='none';
  try{
    const url=`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${mapboxgl.accessToken}&language=fr&limit=5&proximity=${lng},${lat}`;
    const res=await fetch(url);const data=await res.json();
    renderAC(data.features||[]);
  }catch{acList.style.display='none';}
  finally{spn.style.display='none';sico.style.display='block';}
}
function renderAC(features){
  if(!features.length){acList.style.display='none';return;}
  acList.innerHTML='';
  features.forEach(f=>{
    const item=document.createElement('div');item.className='ac-item';
    const name=f.text||f.place_name.split(',')[0];
    const addr=f.place_name.split(',').slice(1,3).join(', ').trim();
    item.innerHTML=`<div class="ac-name">${name}</div><div class="ac-addr">${addr}</div>`;
    item.addEventListener('click',()=>{
      lng=f.center[0];lat=f.center[1];si.value=name;acList.style.display='none';
      map.flyTo({center:[lng,lat],zoom:17,duration:1000});
      go();showToast('📍 '+name);
    });
    acList.appendChild(item);
  });
  acList.style.display='block';
}
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))acList.style.display='none';});
si.addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;acList.style.display='none';
  await fetchPlaces(si.value);const f=acList.querySelector('.ac-item');if(f)f.click();
});

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTmt);toastTmt=setTimeout(()=>t.classList.remove('show'),2600);
}

// Live clock
setInterval(()=>{
  const n=new Date(),lm=n.getHours()*60+n.getMinutes();
  if(!dragging&&Math.abs(lm-mins)<=1){mins=lm;updateSliderUI();go();}
},60000);

window.addEventListener('resize', updateSliderUI);

// Check if venue is in sun at current time
function venueInSun(venue) {
  const h = mins / 60; // current hour as float
  return venue.sunWindows.some(([start, end]) => h >= start && h < end);
}

// Compute sun slots for display — merge windows into readable format
function getSunSlots(venue) {
  return venue.sunWindows.map(([start, end]) => {
    const startStr = `${String(Math.floor(start)).padStart(2,'0')}:${start%1===0.5?'30':'00'}`;
    const endStr   = `${String(Math.floor(end)).padStart(2,'0')}:${end%1===0.5?'30':'00'}`;
    const totalDay = 14; // 8h to 22h window
    const left  = ((start - 8) / totalDay) * 100;
    const width = ((end - start) / totalDay) * 100;
    return { startStr, endStr, left: Math.max(0,left), width: Math.min(width, 100-Math.max(0,left)) };
  });
}

// Add venue markers to map
const venueMarkers = {};

function addVenueMarkers() {
  VENUES.forEach(venue => {
    const el = document.createElement('div');
    el.className = 'venue-pin ' + (venueInSun(venue) ? 'in-sun' : 'in-shade');
    el.innerHTML = venue.emoji;

    const badge = document.createElement('div');
    badge.className = 'pin-badge ' + (venueInSun(venue) ? 'sun' : 'shade');
    badge.textContent = venueInSun(venue) ? '☀' : '●';
    el.appendChild(badge);

    const marker = new mapboxgl.Marker({ element: el, anchor: 'center' })
      .setLngLat([venue.lng, venue.lat])
      .addTo(map);

    el.addEventListener('click', e => {
      e.stopPropagation();
      openVenueCard(venue);
    });

    venueMarkers[venue.id] = { marker, el };
  });
}

// Update all venue pins when time changes
function updateVenuePins() {
  VENUES.forEach(venue => {
    const { el } = venueMarkers[venue.id] || {};
    if (!el) return;
    const inSun = venueInSun(venue);
    el.className = 'venue-pin ' + (inSun ? 'in-sun' : 'in-shade');
    const badge = el.querySelector('.pin-badge');
    if (badge) {
      badge.className = 'pin-badge ' + (inSun ? 'sun' : 'shade');
      badge.textContent = inSun ? '☀' : '●';
    }
  });
  // Update card if open
  if (currentVenue) updateVenueCard(currentVenue);
}

// Open venue card
let currentVenue = null;
function openVenueCard(venue) {
  currentVenue = venue;
  updateVenueCard(venue);
  document.getElementById('venueCard').classList.add('visible');
}

function updateVenueCard(venue) {
  const inSun = venueInSun(venue);
  document.getElementById('vcName').textContent = venue.name;
  document.getElementById('vcType').textContent = venue.type;

  const dot = document.getElementById('vcDot');
  const statusTxt = document.getElementById('vcStatus');
  dot.className = 'status-dot ' + (inSun ? 'sun' : 'shade');
  statusTxt.className = 'venue-status-txt ' + (inSun ? 'sun' : 'shade');
  statusTxt.textContent = inSun ? '☀️ In the sun now' : '🌑 In the shade now';

  // Sun schedule bars
  const slots = getSunSlots(venue);
  const slotsEl = document.getElementById('vcSlots');
  slotsEl.innerHTML = slots.map(s => `
    <div class="sun-slot">
      <span class="slot-time">${s.startStr}</span>
      <div class="slot-bar"><div class="slot-fill" style="margin-left:${s.left}%;width:${s.width}%"></div></div>
      <span class="slot-time">${s.endStr}</span>
    </div>
  `).join('');

  // CTA buttons
  document.getElementById('vcDir').onclick = () => window.open(venue.directionsUrl, '_blank');
  document.getElementById('vcRes').onclick = () => window.open(venue.reserveUrl, '_blank');
}

// Close card
document.getElementById('venueClose').addEventListener('click', () => {
  document.getElementById('venueCard').classList.remove('visible');
  currentVenue = null;
});

// Close on map click
map.on('click', () => {
  document.getElementById('venueCard').classList.remove('visible');
  currentVenue = null;
});
