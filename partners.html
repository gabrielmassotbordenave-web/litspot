<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LitSpot Mettez votre terrasse sur la carte</title>
<meta name="description" content="Faites figurer votre bar ou restaurant sur LitSpot l'app que les Montréalais utilisent pour trouver une terrasse au soleil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sun: #E8890C;
  --sun-light: #FFA928;
  --sun-pale: #FFF3E0;
  --bg: #FFFAF4;
  --bg2: #FFF7EE;
  --text: #1C1410;
  --text2: #5C4A36;
  --muted: rgba(92,74,54,0.55);
  --border: rgba(92,74,54,0.12);
  --border2: rgba(92,74,54,0.06);
  --shadow: rgba(92,74,54,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 18px 48px;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.3s;
}
nav.scrolled {
  background: rgba(255,250,244,0.92);
  backdrop-filter: blur(16px);
  box-shadow: 0 1px 0 var(--border);
}
.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px; font-weight: 400; letter-spacing: -0.5px;
  color: var(--text); text-decoration: none;
}
.nav-logo em { color: var(--sun); font-style: italic; }
.nav-links { display: flex; align-items: center; gap: 32px; }
.nav-link {
  font-size: 14px; color: var(--text2); text-decoration: none;
  transition: color 0.2s;
}
.nav-link:hover { color: var(--sun); }
.nav-cta {
  background: var(--sun); color: #fff;
  border: none; border-radius: 50px;
  padding: 11px 26px; font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500;
  cursor: pointer; text-decoration: none;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(232,137,12,0.3);
}
.nav-cta:hover {
  background: var(--sun-light);
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(232,137,12,0.4);
}

/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 120px 24px 80px;
  text-align: center;
  position: relative;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,169,40,0.18) 0%, transparent 65%);
}

/* Floating circles bg */
.hero-circle {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,169,40,0.12), transparent 70%);
  pointer-events: none;
}
.hero-circle-1 { width: 500px; height: 500px; top: -100px; right: -100px; animation: drift1 14s ease-in-out infinite alternate; }
.hero-circle-2 { width: 300px; height: 300px; bottom: 100px; left: -80px; animation: drift2 10s ease-in-out infinite alternate; }
@keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(-40px,60px); } }
@keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(40px,-40px); } }

.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(232,137,12,0.1); border: 1px solid rgba(232,137,12,0.2);
  border-radius: 50px; padding: 6px 16px;
  font-size: 13px; color: var(--sun); font-weight: 500;
  margin-bottom: 36px;
  opacity: 0; animation: fadeUp 0.7s ease 0.1s forwards;
}

.hero-orb {
  width: 100px; height: 100px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #FFE07A, #FFA928 55%, #E8890C);
  box-shadow: 0 0 0 12px rgba(255,169,40,0.1), 0 0 0 24px rgba(255,169,40,0.05), 0 12px 48px rgba(232,137,12,0.35);
  margin: 0 auto 40px;
  opacity: 0; animation: orbAppear 0.9s ease 0.2s forwards, orbPulse 5s ease-in-out 1s infinite;
}
@keyframes orbAppear {
  from { opacity: 0; transform: scale(0.6); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes orbPulse {
  0%,100% { box-shadow: 0 0 0 12px rgba(255,169,40,0.1), 0 0 0 24px rgba(255,169,40,0.05), 0 12px 48px rgba(232,137,12,0.35); }
  50%     { box-shadow: 0 0 0 20px rgba(255,169,40,0.07), 0 0 0 40px rgba(255,169,40,0.03), 0 12px 64px rgba(232,137,12,0.45); }
}

.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(48px, 9vw, 88px);
  font-weight: 400; line-height: 1.05; letter-spacing: -1px;
  max-width: 780px; margin: 0 auto;
  opacity: 0; animation: fadeUp 0.8s ease 0.3s forwards;
}
.hero-title em { font-style: italic; color: var(--sun); }
.hero-title .light { font-weight: 300; color: var(--text2); }

.hero-sub {
  font-size: 17px; line-height: 1.7; color: var(--text2);
  max-width: 480px; margin: 24px auto 0; font-weight: 300;
  opacity: 0; animation: fadeUp 0.8s ease 0.5s forwards;
}

.hero-actions {
  display: flex; gap: 14px; margin-top: 44px;
  justify-content: center; flex-wrap: wrap;
  opacity: 0; animation: fadeUp 0.8s ease 0.7s forwards;
}
.btn-primary {
  background: var(--sun); color: #fff; border: none;
  border-radius: 50px; padding: 16px 36px;
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
  cursor: pointer; text-decoration: none;
  box-shadow: 0 6px 24px rgba(232,137,12,0.35);
  transition: all 0.2s;
}
.btn-primary:hover { background: var(--sun-light); transform: translateY(-2px); box-shadow: 0 10px 32px rgba(232,137,12,0.45); }
.btn-secondary {
  background: transparent; color: var(--text);
  border: 1.5px solid var(--border); border-radius: 50px;
  padding: 16px 36px; font-size: 15px; font-weight: 500;
  cursor: pointer; text-decoration: none;
  transition: all 0.2s;
}
.btn-secondary:hover { border-color: var(--sun); color: var(--sun); transform: translateY(-2px); }

.hero-stats {
  display: flex; gap: 48px; margin-top: 64px; justify-content: center;
  opacity: 0; animation: fadeUp 0.8s ease 0.9s forwards;
}
.hero-stat { text-align: center; }
.hero-stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px; font-weight: 400; color: var(--sun); line-height: 1;
}
.hero-stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 400; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── PHONE MOCKUP ── */

.ppm-time { font-size: 9px; color: #fff; font-weight: 600; }
.ppm-icon { font-size: 12px; }
.pbc-status { font-size: 9px; color: var(--sun); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.pbc-name { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--text); margin: 3px 0; }
.pbc-bar { height: 4px; background: #f0ebe3; border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
.pbc-bar-fill { height: 100%; width: 60%; background: var(--sun); border-radius: 2px; }
.pbc-times { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); }
.pbc-btns { display: flex; gap: 8px; margin-top: 10px; }
.pbc-btn {
  flex: 1; padding: 7px; border-radius: 8px;
  font-size: 9px; font-weight: 600; text-align: center;
}
.pbc-btn-dir { background: #f0ebe3; color: var(--text2); }
.pbc-btn-res { background: var(--sun); color: #fff; }

/* ── HOW ── */
.section { padding: 80px 24px; max-width: 1080px; margin: 0 auto; }
.section-eyebrow {
  font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--sun); font-weight: 500; margin-bottom: 12px;
}
.section-h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(34px, 5vw, 56px); font-weight: 400;
  line-height: 1.1; color: var(--text);
}
.section-h2 em { font-style: italic; color: var(--sun); }

.steps-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px; margin-top: 56px;
}
.step-card {
  background: #fff;
  border: 1px solid var(--border2);
  border-radius: 20px; padding: 36px 32px;
  box-shadow: 0 4px 24px var(--shadow);
  transition: transform 0.3s, box-shadow 0.3s;
}
.step-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(92,74,54,0.12); }
.step-num-badge {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--sun-pale); color: var(--sun);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px; font-weight: 600;
  margin-bottom: 20px;
}
.step-card-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; margin-bottom: 10px; }
.step-card-desc { font-size: 14px; color: var(--text2); line-height: 1.75; font-weight: 300; }

/* ── WHY ── */
.why-section {
  background: linear-gradient(135deg, #FFF7EE 0%, #FFF3E0 100%);
  padding: 80px 24px;
}
.why-inner { max-width: 1080px; margin: 0 auto; }
.why-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px; margin-top: 56px;
}
.why-card {
  background: #fff; border-radius: 20px;
  padding: 32px 28px;
  box-shadow: 0 2px 16px var(--shadow);
  border: 1px solid var(--border2);
  transition: transform 0.3s;
}
.why-card:hover { transform: translateY(-3px); }
.why-icon {
  width: 48px; height: 48px; border-radius: 14px;
  background: var(--sun-pale); display: flex; align-items: center; justify-content: center;
  font-size: 22px; margin-bottom: 18px;
}
.why-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; margin-bottom: 8px; }
.why-desc { font-size: 14px; color: var(--text2); line-height: 1.75; font-weight: 300; }

/* ── QUOTE ── */
.quote-section {
  padding: 80px 24px;
  text-align: center;
}
.quote-inner { max-width: 720px; margin: 0 auto; }
.quote-mark {
  font-family: 'Cormorant Garamond', serif;
  font-size: 80px; color: var(--sun); line-height: 0.6;
  opacity: 0.4; margin-bottom: 16px;
}
.quote-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(26px, 4vw, 40px); font-weight: 300;
  line-height: 1.4; color: var(--text); font-style: italic;
}
.quote-text strong { font-style: normal; font-weight: 600; color: var(--sun); }

/* ── CONTACT ── */
.contact-section {
  padding: 80px 24px 100px;
  max-width: 680px; margin: 0 auto;
}
.contact-intro { text-align: center; margin-bottom: 56px; }
.contact-sub { font-size: 16px; color: var(--text2); line-height: 1.7; font-weight: 300; margin-top: 16px; }

.form { display: flex; flex-direction: column; gap: 20px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text2); letter-spacing: 0.3px; }
.form-input, .form-textarea {
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
  font-family: 'DM Sans', sans-serif; font-size: 15px;
  color: var(--text); outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-input:focus, .form-textarea:focus {
  border-color: var(--sun);
  box-shadow: 0 0 0 3px rgba(232,137,12,0.12);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--muted); }
.form-textarea { resize: vertical; min-height: 110px; }
.form-submit {
  background: var(--sun); color: #fff;
  border: none; border-radius: 50px; padding: 18px;
  font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; margin-top: 4px;
  box-shadow: 0 6px 24px rgba(232,137,12,0.3);
}
.form-submit:hover { background: var(--sun-light); transform: translateY(-2px); box-shadow: 0 10px 32px rgba(232,137,12,0.4); }

.form-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }

.form-success {
  display: none; text-align: center; padding: 48px 32px;
  background: #fff; border-radius: 24px;
  border: 1px solid rgba(232,137,12,0.2);
  box-shadow: 0 4px 32px var(--shadow);
}
.success-orb {
  width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #FFE07A, #FFA928);
  box-shadow: 0 0 0 12px rgba(255,169,40,0.1), 0 8px 24px rgba(232,137,12,0.3);
  margin: 0 auto 20px;
}
.success-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 400; margin-bottom: 10px; }
.success-text { font-size: 15px; color: var(--text2); line-height: 1.7; font-weight: 300; }

/* ── FOOTER ── */
footer {
  background: var(--text); color: rgba(255,250,244,0.6);
  padding: 40px 48px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; flex-wrap: wrap; gap: 12px;
}
.footer-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 400; color: #fffaf4;
  text-decoration: none;
}
.footer-logo em { color: var(--sun-light); font-style: italic; }
.footer-link { color: rgba(255,250,244,0.5); text-decoration: none; transition: color 0.2s; }
.footer-link:hover { color: var(--sun-light); }

/* ── REVEAL ── */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ── MOBILE ── */
@media (max-width: 640px) {
  nav { padding: 14px 20px; }
  .nav-links { display: none; }
  .form-row { grid-template-columns: 1fr; }
  footer { padding: 28px 20px; }
}

/* ── PHONE FRAME ── */
.screenshot-section {
  padding: 20px 24px 80px;
  display: flex;
  justify-content: center;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
}
.phone-frame {
  position: relative;
  width: 300px;
  animation: phoneFloat 6s ease-in-out infinite;
  filter: drop-shadow(0 40px 60px rgba(92,74,54,0.18)) drop-shadow(0 20px 30px rgba(0,0,0,0.1));
}
@keyframes phoneFloat {
  0%,100% { transform: translateY(0) rotate(-0.5deg); }
  50%      { transform: translateY(-12px) rotate(0.5deg); }
}
.phone-side-btn { position: absolute; background: #d0c8c0; border-radius: 2px; }
.left-btn  { left: -3px; top: 28%; width: 3px; height: 60px; }
.right-btn1 { right: -3px; top: 20%; width: 3px; height: 35px; }
.right-btn2 { right: -3px; top: 32%; width: 3px; height: 60px; }
.phone-inner {
  background: #1a1a1a;
  border-radius: 48px;
  border: 3px solid #2a2a2a;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 0 0 1px rgba(0,0,0,0.3);
}
.phone-island {
  position: absolute;
  top: 12px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 32px;
  background: #1a1a1a; border-radius: 20px; z-index: 10;
}
.phone-screenshot { width: 100%; display: block; border-radius: 45px; }
